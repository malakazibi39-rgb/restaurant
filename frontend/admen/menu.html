<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Management</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        .num{
            font-family:'IBM Plex Mono',monospace;
        }

        :root{
            --charcoal:#221D19;
            --charcoal-2:#2E2721;
            --charcoal-3:#3A312A;
            --cream:#F8F4EA;
            --paper:#FFFFFF;
            --ink:#2B2420;
            --muted:#8A7F72;
            --muted-2:#B4A995;
            --ember:#D98A3D;
            --ember-dark:#B86F2C;
            --ember-tint:#FCEBD6;
            --sage:#6F8A5E;
            --sage-tint:#E7EEE2;
            --rust:#A8442F;
            --line:#E4DCC8;
        }

        body {
            background: var(--cream);
            color: var(--ink);
            min-height: 100vh;
        }

        .app{
            display:grid;
            grid-template-columns:236px 1fr;
            min-height:100vh;
        }

        /* ================= SIDEBAR ================= */

        .sidebar{
            background:var(--charcoal);
            color:var(--cream);
            padding:28px 22px;
            display:flex;
            flex-direction:column;
            gap:36px;
            min-height:100vh;
        }

        .brand{
            display:flex;
            flex-direction:column;
            gap:2px;
            border-bottom:1px solid rgba(248,244,234,.12);
            padding-bottom:20px;
        }

        .brand .mark{
            font-family:'Fraunces',serif;
            font-weight:700;
            font-size:22px;
        }

        .brand .mark span{
            color:var(--ember);
        }

        .brand .sub{
            font-size:11px;
            letter-spacing:.14em;
            text-transform:uppercase;
            color:var(--muted-2);
        }

        nav{
            display:flex;
            flex-direction:column;
            gap:3px;
        }

        .navlink{
            display:flex;
            align-items:center;
            gap:12px;
            padding:11px 12px;
            border-radius:3px;
            color:var(--muted-2);
            text-decoration:none;
            font-family:'Inter',sans-serif;
            font-size:14px;
            font-weight:500;
            cursor:pointer;
            transition:.2s;
        }

        .navlink:hover,
        .navlink.active{
            background:var(--charcoal-2);
            color:var(--cream);
        }

        .navlink.active{
            border-left:3px solid var(--ember);
        }

        .navlink svg{
            width:17px;
            height:17px;
            flex-shrink:0;
        }

        .shift-card{
            margin-top:auto;
            background:var(--charcoal-2);
            border:1px dashed rgba(248,244,234,.18);
            border-radius:3px;
            padding:14px;
            font-family:'Inter',sans-serif;
            font-size:12px;
            color:var(--muted-2);
            line-height:1.5;
        }

        .shift-card strong{
            display:block;
            color:var(--cream);
            font-size:13px;
            margin-bottom:3px;
        }

        /* ================= MAIN ================= */

        .main {
            width: 100%;
            max-width: 1250px;
            padding: 30px;
        }

        /* ================= TOPBAR ================= */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .topbar h1 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            color: var(--ink);
            font-size: 30px;
        }

        .topbar p,
        .date {
            color: var(--muted);
            font-size: 13px;
            margin-top: 5px;
        }

        .admin-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--charcoal);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .admin-info strong {
            font-size: 13px;
            display: block;
        }

        .admin-info small {
            font-size: 11px;
            color: var(--muted);
        }

        .header {
            display: flex;
            justify-content: flex-end;
        }

        /* ================= BUTTON ================= */

        .btn {
            border: none;
            border-radius: 0;
            padding: 11px 17px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--charcoal);
            color: white;
        }

        .btn-primary:hover {
            background: var(--ember-dark);
        }

        .btn-cancel {
            border: 1px solid var(--line);
            background: var(--cream);
            color: var(--ink);
        }

        .btn-edit {
            background: var(--cream);
            color: var(--ink);
        }

        .btn-edit:hover {
            background: var(--ember-tint);
        }

        .btn-delete {
            background: var(--rust-tint, #F5E3DE);
            color: var(--rust);
        }

        .btn-delete:hover {
            background: #F5E3DE;
        }

        /* ================= STATS ================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--paper);
            border: 1px solid var(--line);
            padding: 19px;
        }

        .stat-card h4 {
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .1em;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .stat-card h2 {
            font-family: 'IBM Plex Mono', monospace;
            color: var(--ink);
            font-size: 27px;
            font-weight: 600;
        }

        /* ================= TOOLBAR ================= */

        .toolbar {
            background: var(--paper);
            border: 1px solid var(--line);
            padding: 18px;
            margin-bottom: 18px;

            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search {
            flex: 1;
            min-width: 220px;
        }

        .search input,
        .toolbar select {
            width: 100%;
            padding: 11px 14px;
            background: var(--cream);
            border: 1px solid var(--line);
            border-radius: 0;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
        }

        .search input:focus,
        .toolbar select:focus {
            border-color: var(--ember);
        }

        .toolbar select {
            width: 180px;
            background: var(--cream);
        }

        /* ================= TABLE ================= */

        .table-container {
            background: var(--paper);
            border: 1px solid var(--line);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }

        th {
            background: var(--paper);
            color: var(--muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        td {
            color: var(--ink);
            font-size: 13px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-image {
            width: 50px;
            height: 50px;
            background: var(--cream);
            border: 1px solid var(--line);
            border-radius: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 24px;
            overflow: hidden;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-name {
            font-weight: 600;
            color: var(--ink);
        }

        .item-description {
            font-size: 11px;
            color: var(--muted);
            margin-top: 3px;
            max-width: 280px;
        }

        .category {
            display: inline-block;
            background: var(--ember-tint);
            color: var(--ember-dark);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
        }

        .price {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            color: var(--ember-dark);
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .actions button {
            border: none;
            padding: 7px 10px;
            border-radius: 0;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }

        /* ================= MODAL ================= */

        .modal {
            display: none;

            position: fixed;
            z-index: 1000;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: rgba(34,29,25,.6);

            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .modal-content {
            width: 100%;
            max-width: 550px;

            background: var(--paper);
            border: 1px solid var(--line);

            border-radius: 0;
            padding: 26px;

            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 22px;
        }

        .modal-header h2 {
            font-family: 'Fraunces', serif;
            color: var(--ink);
            font-size: 21px;
        }

        .close {
            font-size: 25px;
            color: var(--muted);
            cursor: pointer;
        }

        .close:hover {
            color: var(--ink);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: var(--ink);
            font-size: 11px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 11px;

            background: var(--cream);
            border: 1px solid var(--line);
            border-radius: 0;

            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--ember);
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 22px;
        }

        /* ================= MESSAGE ================= */

        .message {
            position: fixed;

            top: 20px;
            right: 20px;

            padding: 14px 20px;

            border-radius: 0;

            color: white;

            display: none;

            z-index: 2000;
        }

        .success {
            background: var(--sage);
        }

        .error {
            background: var(--rust);
        }

        /* ================= EMPTY ================= */

        .empty {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 1000px) {

            .app{
                grid-template-columns:1fr;
            }

            .sidebar{
                min-height:auto;
                flex-direction:row;
                align-items:center;
                overflow-x:auto;
                padding:15px;
            }

            .brand{
                border:none;
                padding:0;
            }

            nav{
                flex-direction:row;
            }

            .shift-card{
                display:none;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 700px) {

            .main {
                padding: 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>


<!-- =====================================================
     APP
===================================================== -->

<div class="app">


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar">

    <div class="brand">

        <div class="mark">
            The <span>Marrow</span>
        </div>

        <div class="sub">

        </div>

    </div>

    <nav>

        <a class="navlink" href="index.html">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="9"/>
                <rect x="14" y="3" width="7" height="5"/>

        <a class="navlink" href="orders.html">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>

            Menu

        </a>

        <a class="navlink" href="statistics.html">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 3v18h18"/>

    <div class="shift-card">

        <strong>Evening service</strong>

        Doors at 5:00 PM ·

        <span>6 staff scheduled tonight</span>

    </div>

</aside>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <!-- TOPBAR -->

    <div class="topbar">

        <div>

            <h1>Menu</h1>

            <div class="date" id="today-date"></div>

        </div>

        <div class="admin-profile">

            <div class="avatar">
                A
            </div>

            <div class="admin-info">

                <strong>Admin</strong>

                <small>Restaurant Manager</small>

            </div>

        </div>

    </div>


    <!-- =================================================
         STATISTICS
    ================================================= -->

    <div class="stats">

        <div class="stat-card">

            <h4>Total Meals</h4>

            <h2 id="totalItems">
                0
            </h2>

        </div>


        <div class="stat-card">

            <h4>Meals</h4>

            <h2 id="mealCount">
                0
            </h2>

        </div>


        <div class="stat-card">

            <h4>Categories</h4>

            <h2 id="totalCategories">
                0
            </h2>

        </div>


        <div class="stat-card">

            <h4>Average Price</h4>

            <h2 id="averagePrice">
                0 DA
            </h2>

        </div>

    </div>


    <!-- =================================================
         TOOLBAR
    ================================================= -->

    <div class="toolbar">


        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="Search meal..."
                oninput="filterMenu()"
            >

        </div>


        <select
            id="categoryFilter"
            onchange="filterMenu()"
        >

            <option value="">
                All Categories
            </option>

        </select>


        <button
            class="btn btn-primary"
            onclick="loadMenu()"
        >
            ↻ Refresh
        </button>

        <button
            class="btn btn-primary"
            onclick="openAddModal()"
        >
            + Add Meal
        </button>

    </div>


    <!-- =================================================
         MENU TABLE
    ================================================= -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>
                        Meal
                    </th>

                    <th>
                        Category
                    </th>

                    <th>
                        Price
                    </th>

                    <th>
                        Actions
                    </th>

                </tr>

            </thead>


            <tbody id="menuTableBody">

                <tr>

                    <td
                        colspan="4"
                        class="empty"
                    >
                        Loading meals...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>

</div>


<!-- =====================================================
     ADD / EDIT MODAL
===================================================== -->

<div
    class="modal"
    id="itemModal"
>

    <div class="modal-content">


        <div class="modal-header">

            <h2 id="modalTitle">
                Add Meal
            </h2>

            <span
                class="close"
                onclick="closeModal()"
            >
                &times;
            </span>

        </div>


        <form id="menuForm">


            <!-- ID -->

            <input
                type="hidden"
                id="itemId"
            >


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Meal Name
                </label>

                <input
                    type="text"
                    id="itemName"
                    placeholder="Example: Pizza Margherita"
                    required
                >

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label>
                    Category
                </label>

                <select
                    id="itemCategory"
                    required
                >

                    <option value="">
                        Select Category
                    </option>

                </select>

            </div>


            <!-- PRICE -->

            <div class="form-group">

                <label>
                    Price (DA)
                </label>

                <input
                    type="number"
                    id="itemPrice"
                    placeholder="Example: 1200"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="itemDescription"
                    placeholder="Describe the meal..."
                ></textarea>

            </div>


            <!-- IMAGE -->

            <div class="form-group">

                <label>
                    Image
                </label>

                <input
                    type="text"
                    id="itemImage"
                    placeholder="Example: 🍕 or image URL"
                >

            </div>


            <!-- BUTTONS -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-cancel"
                    onclick="closeModal()"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Meal
                </button>

            </div>

        </form>

    </div>

</div>


<!-- MESSAGE -->

<div
    id="message"
    class="message"
></div>


<script>


/* =====================================================
   DATE
===================================================== */

document.getElementById("today-date").textContent =
    new Date().toLocaleDateString("en-US", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    });


/* =====================================================
   API
===================================================== */

const API_URL =
    "http://localhost:5000/api/menu";


/* =====================================================
   VARIABLES
===================================================== */

let menuItems = [];

let categories = [];


/* =====================================================
   LOAD CATEGORIES
===================================================== */

async function loadCategories() {

    try {

        const response =
            await fetch(
                `${API_URL}/categories`
            );


        if (!response.ok) {

            throw new Error(
                "Cannot load categories"
            );

        }


        categories =
            await response.json();


        fillCategories();


    } catch (error) {

        console.error(
            "Categories error:",
            error
        );

    }

}


/* =====================================================
   FILL CATEGORY SELECTS
===================================================== */

function fillCategories() {

    const filter =
        document.getElementById(
            "categoryFilter"
        );


    const select =
        document.getElementById(
            "itemCategory"
        );


    filter.innerHTML = `
        <option value="">
            All Categories
        </option>
    `;


    select.innerHTML = `
        <option value="">
            Select Category
        </option>
    `;


    categories.forEach(category => {


        filter.innerHTML += `
            <option value="${category.id}">
                ${escapeHTML(category.name)}
            </option>
        `;


        select.innerHTML += `
            <option value="${category.id}">
                ${escapeHTML(category.name)}
            </option>
        `;

    });

}


/* =====================================================
   LOAD MENU
===================================================== */

async function loadMenu() {

    const tableBody =
        document.getElementById(
            "menuTableBody"
        );


    tableBody.innerHTML = `
        <tr>
            <td
                colspan="4"
                class="empty"
            >
                Loading meals...
            </td>
        </tr>
    `;


    try {

        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                "Cannot load menu"
            );

        }


        menuItems =
            await response.json();


        displayMenu(menuItems);

        updateStats();


    } catch (error) {

        console.error(error);


        tableBody.innerHTML = `
            <tr>
                <td
                    colspan="4"
                    class="empty"
                >
                    ❌ Cannot connect to server.
                    <br><br>
                    Make sure Node.js is running.
                </td>
            </tr>
        `;

    }

}


/* =====================================================
   DISPLAY MENU
===================================================== */

function displayMenu(items) {

    const tableBody =
        document.getElementById(
            "menuTableBody"
        );


    if (!items.length) {

        tableBody.innerHTML = `
            <tr>
                <td
                    colspan="4"
                    class="empty"
                >
                    No meals found.
                </td>
            </tr>
        `;

        return;
    }


    tableBody.innerHTML = "";


    items.forEach(item => {


        let imageHTML = "🍽️";


        if (item.image) {


            if (
                item.image.startsWith("http://") ||
                item.image.startsWith("https://")
            ) {

                imageHTML = `
                    <img
                        src="${escapeHTML(item.image)}"
                        alt="${escapeHTML(item.name)}"
                    >
                `;

            } else {

                imageHTML =
                    escapeHTML(item.image);

            }

        }


        tableBody.innerHTML += `

            <tr>

                <td>

                    <div class="item">

                        <div class="item-image">
                            ${imageHTML}
                        </div>

                        <div>

                            <div class="item-name">
                                ${escapeHTML(item.name || "")}
                            </div>

                            <div class="item-description">
                                ${escapeHTML(
                                    item.description || ""
                                )}
                            </div>

                        </div>

                    </div>

                </td>


                <td>

                    <span class="category">
                        ${escapeHTML(
                            item.category ||
                            "No category"
                        )}
                    </span>

                </td>


                <td>

                    <span class="price">

                        ${Number(
                            item.price || 0
                        ).toFixed(2)}

                        DA

                    </span>

                </td>


                <td>

                    <div class="actions">

                        <button
                            class="btn-edit"
                            onclick="editItem(${item.id})"
                        >
                            Edit
                        </button>


                        <button
                            class="btn-delete"
                            onclick="deleteItem(${item.id})"
                        >
                            Delete
                        </button>

                    </div>

                </td>

            </tr>

        `;

    });

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStats() {

    const total =
        menuItems.length;


    const totalPrice =
        menuItems.reduce(
            (sum, item) =>
                sum + Number(item.price || 0),
            0
        );


    const average =
        total > 0
            ? totalPrice / total
            : 0;


    const uniqueCategories =
        new Set(
            menuItems
                .map(item => item.category_id)
                .filter(id => id !== null)
        ).size;


    document.getElementById(
        "totalItems"
    ).textContent = total;


    document.getElementById(
        "mealCount"
    ).textContent = total;


    document.getElementById(
        "totalCategories"
    ).textContent =
        uniqueCategories;


    document.getElementById(
        "averagePrice"
    ).textContent =
        average.toFixed(2) + " DA";

}


/* =====================================================
   SEARCH + FILTER
===================================================== */

function filterMenu() {

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .toLowerCase()
        .trim();


    const category =
        document.getElementById(
            "categoryFilter"
        ).value;


    const filtered =
        menuItems.filter(item => {


            const matchesSearch =
                (item.name || "")
                    .toLowerCase()
                    .includes(search);


            const matchesCategory =
                !category ||
                String(item.category_id) ===
                String(category);


            return (
                matchesSearch &&
                matchesCategory
            );

        });


    displayMenu(filtered);

}


/* =====================================================
   OPEN ADD MODAL
===================================================== */

function openAddModal() {

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Add Meal";


    document.getElementById(
        "itemId"
    ).value = "";


    document.getElementById(
        "itemName"
    ).value = "";


    document.getElementById(
        "itemCategory"
    ).value = "";


    document.getElementById(
        "itemPrice"
    ).value = "";


    document.getElementById(
        "itemDescription"
    ).value = "";


    document.getElementById(
        "itemImage"
    ).value = "";


    document.getElementById(
        "itemModal"
    ).style.display = "flex";

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal() {

    document.getElementById(
        "itemModal"
    ).style.display = "none";

}


/* =====================================================
   EDIT ITEM
===================================================== */

function editItem(id) {

    const item =
        menuItems.find(
            item =>
                Number(item.id) ===
                Number(id)
        );


    if (!item) {

        showMessage(
            "Meal not found",
            "error"
        );

        return;
    }


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Meal";


    document.getElementById(
        "itemId"
    ).value =
        item.id;


    document.getElementById(
        "itemName"
    ).value =
        item.name || "";


    document.getElementById(
        "itemCategory"
    ).value =
        item.category_id || "";


    document.getElementById(
        "itemPrice"
    ).value =
        item.price || "";


    document.getElementById(
        "itemDescription"
    ).value =
        item.description || "";


    document.getElementById(
        "itemImage"
    ).value =
        item.image || "";


    document.getElementById(
        "itemModal"
    ).style.display = "flex";

}


/* =====================================================
   SAVE MEAL
===================================================== */

document.getElementById(
    "menuForm"
).addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        const id =
            document.getElementById(
                "itemId"
            ).value;


        const data = {

            category_id:
                document.getElementById(
                    "itemCategory"
                ).value || null,

            name:
                document.getElementById(
                    "itemName"
                ).value.trim(),

            description:
                document.getElementById(
                    "itemDescription"
                ).value.trim(),

            price:
                Number(
                    document.getElementById(
                        "itemPrice"
                    ).value
                ),

            image:
                document.getElementById(
                    "itemImage"
                ).value.trim()

        };


        try {


            let response;


            /* ==========================
               EDIT
            ========================== */

            if (id) {


                response =
                    await fetch(
                        `${API_URL}/${id}`,
                        {

                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(data)

                        }
                    );


            }

            /* ==========================
               ADD
            ========================== */

            else {


                response =
                    await fetch(
                        API_URL,
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(data)

                        }
                    );

            }


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.message ||
                    "Operation failed"
                );

            }


            closeModal();


            showMessage(
                id
                    ? "Meal updated successfully!"
                    : "Meal added successfully!",
                "success"
            );


            await loadMenu();


        } catch (error) {

            console.error(error);


            showMessage(
                error.message,
                "error"
            );

        }

    }
);


/* =====================================================
   DELETE MEAL
===================================================== */

async function deleteItem(id) {


    const item =
        menuItems.find(
            item =>
                Number(item.id) ===
                Number(id)
        );


    if (!item) {
        return;
    }


    const confirmed =
        confirm(
            `Are you sure you want to delete "${item.name}"?`
        );


    if (!confirmed) {
        return;
    }


    try {


        const response =
            await fetch(
                `${API_URL}/${id}`,
                {
                    method: "DELETE"
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Cannot delete meal"
            );

        }


        showMessage(
            "Meal deleted successfully!",
            "success"
        );


        await loadMenu();


    } catch (error) {

        console.error(error);


        showMessage(
            error.message,
            "error"
        );

    }

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " + type;


    message.style.display =
        "block";


    setTimeout(
        () => {

            message.style.display =
                "none";

        },
        3000
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   CLOSE MODAL WHEN CLICK OUTSIDE
===================================================== */

window.addEventListener(
    "click",
    function(event) {

        const modal =
            document.getElementById(
                "itemModal"
            );


        if (event.target === modal) {

            closeModal();

        }

    }
);


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    const confirmLogout =
        confirm(
            "Are you sure you want to logout?"
        );


    if (confirmLogout) {

        window.location.href =
            "../login.html";

    }

}


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        await loadCategories();

        await loadMenu();

    }
);

</script>
