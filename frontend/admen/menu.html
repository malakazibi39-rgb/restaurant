<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Marrow — Menu Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f6f7f9;
            color: #222;
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: #171717;
            color: white;
            padding: 25px 18px;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }

        .logo span {
            color: #c89b3c;
        }

        .nav a {
            display: block;
            color: #ccc;
            text-decoration: none;
            padding: 13px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .nav a:hover,
        .nav a.active {
            background: #c89b3c;
            color: white;
        }

        .logout {
            position: absolute;
            bottom: 25px;
            left: 18px;
            right: 18px;
        }

        /* MAIN */
        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 30px;
        }

        .admin {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #c89b3c;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        /* STATS */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .card p {
            color: #777;
            margin-bottom: 10px;
        }

        .card h2 {
            font-size: 28px;
        }

        /* TOOLBAR */
        .toolbar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .left-tools {
            display: flex;
            gap: 10px;
            flex: 1;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #c89b3c;
        }

        #search {
            width: 300px;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 7px;
            padding: 12px 18px;
            font-weight: bold;
        }

        .add-btn {
            background: #c89b3c;
            color: white;
        }

        .add-btn:hover {
            background: #a97f2f;
        }

        /* TABLE */
        .table-container {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #fafafa;
            color: #555;
        }

        tr:hover {
            background: #fafafa;
        }

        .food {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .food-img {
            width: 55px;
            height: 55px;
            border-radius: 8px;
            background: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
        }

        .food-name {
            font-weight: bold;
        }

        .food-desc {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .price {
            font-weight: bold;
            color: #c89b3c;
        }

        .badge {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .available {
            background: #e5f7ed;
            color: #16854b;
        }

        .unavailable {
            background: #fde8e8;
            color: #c0392b;
        }

        .category {
            color: #555;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .edit {
            background: #eee;
            color: #333;
        }

        .delete {
            background: #fbe5e5;
            color: #c0392b;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 520px;
            max-width: 95%;
            padding: 30px;
            border-radius: 14px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 24px;
        }

        .close {
            font-size: 25px;
            cursor: pointer;
            color: #777;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel {
            background: #eee;
        }

        .save {
            background: #c89b3c;
            color: white;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                width: calc(100% - 190px);
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .toolbar {
                flex-direction: column;
            }

            .left-tools {
                flex-wrap: wrap;
            }
        }

        @media (max-width: 650px) {
            .sidebar {
                display: none;
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            #search {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            The <span>Marrow</span>
        </div>

        <nav class="nav">

            <a href="home.html">
                🏠 Dashboard
            </a>

            <a href="orders.html">
                🛒 Orders
            </a>

            <a href="staff.html">
                👥 Staff
            </a>

            <a href="menu.html" class="active">
                🍽 Menu
            </a>

            <a href="statistics.html">
                📊 Statistics
            </a>

            <a href="settings.html">
                ⚙ Settings
            </a>

        </nav>

        <div class="logout">
            <a href="login.html" class="nav">
                🚪 Logout
            </a>
        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <!-- TOP BAR -->
        <div class="topbar">

            <div>
                <h1>Menu Management</h1>
                <p style="color:#777; margin-top:6px;">
                    Manage your restaurant menu and items
                </p>
            </div>

            <div class="admin">

                <div>
                    <strong>Admin</strong>
                    <p style="font-size:12px;color:#777;">
                        Administrator
                    </p>
                </div>

                <div class="avatar">
                    A
                </div>

            </div>

        </div>


        <!-- STATISTICS -->
        <section class="stats">

            <div class="card">
                <p>Total Items</p>
                <h2 id="totalItems">0</h2>
            </div>

            <div class="card">
                <p>Available</p>
                <h2 id="availableItems">0</h2>
            </div>

            <div class="card">
                <p>Categories</p>
                <h2 id="totalCategories">0</h2>
            </div>

            <div class="card">
                <p>Average Price</p>
                <h2 id="averagePrice">0 DA</h2>
            </div>

        </section>


        <!-- TOOLBAR -->
        <section class="toolbar">

            <div class="left-tools">

                <input
                    type="text"
                    id="search"
                    placeholder="Search menu item..."
                    oninput="filterMenu()"
                >

                <select id="categoryFilter" onchange="filterMenu()">

                    <option value="all">
                        All Categories
                    </option>

                    <option value="Starter">
                        Starters
                    </option>

                    <option value="Main Course">
                        Main Course
                    </option>

                    <option value="Pizza">
                        Pizza
                    </option>

                    <option value="Burger">
                        Burger
                    </option>

                    <option value="Dessert">
                        Dessert
                    </option>

                    <option value="Drinks">
                        Drinks
                    </option>

                </select>

                <select id="statusFilter" onchange="filterMenu()">

                    <option value="all">
                        All Status
                    </option>

                    <option value="Available">
                        Available
                    </option>

                    <option value="Unavailable">
                        Unavailable
                    </option>

                </select>

            </div>

            <button class="add-btn" onclick="openAddModal()">
                + Add Item
            </button>

        </section>


        <!-- MENU TABLE -->
        <section class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Item</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="menuTable">

                </tbody>

            </table>

        </section>

    </main>


    <!-- MODAL -->
    <div class="modal" id="menuModal">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Add Menu Item
                </h2>

                <span class="close" onclick="closeModal()">
                    &times;
                </span>

            </div>


            <form id="menuForm">

                <input type="hidden" id="itemId">


                <div class="form-group">

                    <label>
                        Item Name
                    </label>

                    <input
                        type="text"
                        id="itemName"
                        placeholder="Example: Margherita Pizza"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Category
                        </label>

                        <select id="itemCategory" required>

                            <option value="">
                                Select category
                            </option>

                            <option value="Starter">
                                Starter
                            </option>

                            <option value="Main Course">
                                Main Course
                            </option>

                            <option value="Pizza">
                                Pizza
                            </option>

                            <option value="Burger">
                                Burger
                            </option>

                            <option value="Dessert">
                                Dessert
                            </option>

                            <option value="Drinks">
                                Drinks
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Price (DA)
                        </label>

                        <input
                            type="number"
                            id="itemPrice"
                            min="0"
                            placeholder="1200"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Description
                    </label>

                    <textarea
                        id="itemDescription"
                        placeholder="Describe the menu item..."
                    ></textarea>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Status
                        </label>

                        <select id="itemStatus">

                            <option value="Available">
                                Available
                            </option>

                            <option value="Unavailable">
                                Unavailable
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Emoji / Image
                        </label>

                        <input
                            type="text"
                            id="itemImage"
                            placeholder="🍕"
                        >

                    </div>

                </div>


                <div class="modal-buttons">

                    <button
                        type="button"
                        class="cancel"
                        onclick="closeModal()"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="save"
                    >
                        Save Item
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script>

        /* =========================
           MENU DATA
        ========================= */

        let menuItems = [

            {
                id: 1,
                name: "Caesar Salad",
                category: "Starter",
                price: 850,
                description: "Fresh salad with chicken and parmesan",
                status: "Available",
                image: "🥗"
            },

            {
                id: 2,
                name: "Margherita Pizza",
                category: "Pizza",
                price: 1200,
                description: "Tomato, mozzarella and basil",
                status: "Available",
                image: "🍕"
            },

            {
                id: 3,
                name: "Classic Burger",
                category: "Burger",
                price: 1400,
                description: "Beef burger with cheese and vegetables",
                status: "Available",
                image: "🍔"
            },

            {
                id: 4,
                name: "Grilled Chicken",
                category: "Main Course",
                price: 1600,
                description: "Grilled chicken with vegetables",
                status: "Available",
                image: "🍗"
            },

            {
                id: 5,
                name: "Chocolate Cake",
                category: "Dessert",
                price: 700,
                description: "Chocolate cake with cream",
                status: "Unavailable",
                image: "🍰"
            },

            {
                id: 6,
                name: "Fresh Orange Juice",
                category: "Drinks",
                price: 500,
                description: "Freshly squeezed orange juice",
                status: "Available",
                image: "🍊"
            }

        ];


        /* =========================
           DISPLAY MENU
        ========================= */

        function displayMenu(items = menuItems) {

            const table = document.getElementById("menuTable");

            table.innerHTML = "";

            items.forEach(item => {

                const row = document.createElement("tr");

                row.innerHTML = `

                    <td>

                        <div class="food">

                            <div class="food-img">
                                ${item.image}
                            </div>

                            <div>

                                <div class="food-name">
                                    ${item.name}
                                </div>

                                <div class="food-desc">
                                    ${item.description}
                                </div>

                            </div>

                        </div>

                    </td>


                    <td>
                        <span class="category">
                            ${item.category}
                        </span>
                    </td>


                    <td>
                        <span class="price">
                            ${item.price} DA
                        </span>
                    </td>


                    <td>

                        <span class="badge ${
                            item.status === "Available"
                            ? "available"
                            : "unavailable"
                        }">

                            ${item.status}

                        </span>

                    </td>


                    <td>

                        <div class="actions">

                            <button
                                class="edit"
                                onclick="editItem(${item.id})"
                            >
                                Edit
                            </button>

                            <button
                                class="delete"
                                onclick="deleteItem(${item.id})"
                            >
                                Delete
                            </button>

                        </div>

                    </td>

                `;

                table.appendChild(row);

            });

            updateStats();

        }


        /* =========================
           STATISTICS
        ========================= */

        function updateStats() {

            document.getElementById("totalItems").textContent =
                menuItems.length;


            document.getElementById("availableItems").textContent =
                menuItems.filter(
                    item => item.status === "Available"
                ).length;


            const categories = new Set(
                menuItems.map(item => item.category)
            );

            document.getElementById("totalCategories").textContent =
                categories.size;


            if (menuItems.length > 0) {

                const average =
                    menuItems.reduce(
                        (sum, item) => sum + Number(item.price),
                        0
                    ) / menuItems.length;

                document.getElementById("averagePrice").textContent =
                    Math.round(average) + " DA";

            } else {

                document.getElementById("averagePrice").textContent =
                    "0 DA";

            }

        }


        /* =========================
           SEARCH + FILTER
        ========================= */

        function filterMenu() {

            const search =
                document
                .getElementById("search")
                .value
                .toLowerCase();


            const category =
                document.getElementById("categoryFilter").value;


            const status =
                document.getElementById("statusFilter").value;


            const filtered = menuItems.filter(item => {

                const matchesSearch =
                    item.name
                    .toLowerCase()
                    .includes(search);


                const matchesCategory =
                    category === "all" ||
                    item.category === category;


                const matchesStatus =
                    status === "all" ||
                    item.status === status;


                return (
                    matchesSearch &&
                    matchesCategory &&
                    matchesStatus
                );

            });


            displayMenu(filtered);

        }


        /* =========================
           OPEN ADD MODAL
        ========================= */

        function openAddModal() {

            document.getElementById("modalTitle").textContent =
                "Add Menu Item";

            document.getElementById("menuForm").reset();

            document.getElementById("itemId").value = "";

            document.getElementById("menuModal").style.display =
                "flex";

        }


        /* =========================
           CLOSE MODAL
        ========================= */

        function closeModal() {

            document.getElementById("menuModal").style.display =
                "none";

        }


        /* =========================
           EDIT ITEM
        ========================= */

        function editItem(id) {

            const item =
                menuItems.find(item => item.id === id);

            if (!item) return;


            document.getElementById("modalTitle").textContent =
                "Edit Menu Item";


            document.getElementById("itemId").value =
                item.id;


            document.getElementById("itemName").value =
                item.name;


            document.getElementById("itemCategory").value =
                item.category;


            document.getElementById("itemPrice").value =
                item.price;


            document.getElementById("itemDescription").value =
                item.description;


            document.getElementById("itemStatus").value =
                item.status;


            document.getElementById("itemImage").value =
                item.image;


            document.getElementById("menuModal").style.display =
                "flex";

        }


        /* =========================
           SAVE ITEM
        ========================= */

        document
        .getElementById("menuForm")
        .addEventListener("submit", function(e) {

            e.preventDefault();


            const id =
                document.getElementById("itemId").value;


            const itemData = {

                name:
                    document.getElementById("itemName").value,

                category:
                    document.getElementById("itemCategory").value,

                price:
                    Number(
                        document.getElementById("itemPrice").value
                    ),

                description:
                    document.getElementById("itemDescription").value,

                status:
                    document.getElementById("itemStatus").value,

                image:
                    document.getElementById("itemImage").value || "🍽"

            };


            if (id) {

                const index =
                    menuItems.findIndex(
                        item => item.id == id
                    );

                menuItems[index] = {
                    id: Number(id),
                    ...itemData
                };

            } else {

                const newItem = {

                    id:
                        Date.now(),

                    ...itemData

                };

                menuItems.push(newItem);

            }


            displayMenu();

            closeModal();

            this.reset();

        });


        /* =========================
           DELETE ITEM
        ========================= */

        function deleteItem(id) {

            const item =
                menuItems.find(item => item.id === id);


            if (!item) return;


            const confirmation =
                confirm(
                    `Are you sure you want to delete "${item.name}"?`
                );


            if (!confirmation) return;


            menuItems =
                menuItems.filter(
                    item => item.id !== id
                );


            displayMenu();

        }


        /* =========================
           CLOSE WHEN CLICK OUTSIDE
        ========================= */

        window.addEventListener("click", function(e) {

            const modal =
                document.getElementById("menuModal");


            if (e.target === modal) {

                closeModal();

            }

        });


        /* =========================
           INITIAL DISPLAY
        ========================= */

        displayMenu();

    </script>

</body>
</html>
