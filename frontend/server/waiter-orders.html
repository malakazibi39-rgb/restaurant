<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiter Orders - Restaurant Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            color: #2d3436;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            background: #1f2937;
            color: white;
            padding: 20px 15px;
            position: fixed;
            height: 100vh;
        }

        .logo {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .logo span {
            color: #3498db;
        }

        .profile {
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 1px solid #374151;
            margin-bottom: 20px;
        }

        .avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #3498db;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 28px;
        }

        .profile h3 {
            margin-top: 10px;
        }

        .profile p {
            color: #9ca3af;
            font-size: 13px;
        }

        .menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #d1d5db;
            text-decoration: none;
            padding: 13px 15px;
            border-radius: 8px;
            margin-bottom: 7px;
        }

        .menu a:hover,
        .menu a.active {
            background: #3498db;
            color: white;
        }

        .logout {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
        }

        .logout a {
            color: #ff7675;
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            width: calc(100% - 250px);
        }

        .topbar {
            height: 70px;
            background: white;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
        }

        .date {
            color: #777;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        .stat h3 {
            font-size: 28px;
            margin: 8px 0;
        }

        .stat p {
            color: #777;
            font-size: 14px;
        }

        /* TOOLBAR */

        .toolbar {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .filters {
            display: flex;
            gap: 8px;
        }

        .filter {
            border: none;
            padding: 10px 15px;
            border-radius: 7px;
            cursor: pointer;
            background: #f1f2f6;
            font-weight: bold;
        }

        .filter.active {
            background: #3498db;
            color: white;
        }

        .search {
            width: 240px;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
        }

        /* TABLE */

        .orders-box {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            text-align: left;
            padding: 16px;
            background: #f8f9fa;
            color: #666;
            font-size: 13px;
        }

        td {
            padding: 16px;
            border-top: 1px solid #eee;
            font-size: 14px;
        }

        .order-id {
            font-weight: bold;
        }

        .customer {
            font-weight: bold;
        }

        .customer small {
            color: #777;
            font-weight: normal;
        }

        .items {
            color: #666;
            line-height: 1.6;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .new {
            background: #fff3cd;
            color: #856404;
        }

        .confirmed {
            background: #e0e7ff;
            color: #4338ca;
        }

        .cooking {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .ready {
            background: #d1fae5;
            color: #047857;
        }

        .served {
            background: #e5e7eb;
            color: #374151;
        }

        /* BUTTONS */

        .btn {
            border: none;
            padding: 8px 11px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            margin: 2px;
        }

        .confirm {
            background: #3498db;
            color: white;
        }

        .serve {
            background: #27ae60;
            color: white;
        }

        .view {
            background: #f1f2f6;
        }

        .btn:hover {
            opacity: 0.85;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-content {
            width: 500px;
            max-width: 90%;
            background: white;
            border-radius: 12px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .close {
            font-size: 27px;
            cursor: pointer;
        }

        .detail {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .detail span:first-child {
            color: #777;
            display: block;
            margin-bottom: 5px;
        }

        /* LOADING */

        .loading {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #e74c3c;
        }

        /* RESPONSIVE */

        @media(max-width: 1000px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media(max-width: 700px) {

            .sidebar {
                width: 70px;
                padding: 15px 8px;
            }

            .logo span,
            .profile h3,
            .profile p,
            .menu span {
                display: none;
            }

            .profile {
                border: none;
            }

            .main {
                margin-left: 70px;
                width: calc(100% - 70px);
            }

            .content {
                padding: 15px;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .filters {
                overflow-x: auto;
            }

            .search {
                width: 100%;
            }
        }
    </style>

</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            🍽️ <span>Restaurant</span>
        </div>

        <div class="profile">

            <div class="avatar">
                🧑‍🍳
            </div>

            <h3>Waiter</h3>
            <p>Waiter</p>

        </div>

        <nav class="menu">

            <a href="waiter.html">
                🏠
                <span>Dashboard</span>
            </a>

            <a href="waiter-orders.html" class="active">
                📋
                <span>Orders</span>
            </a>

            <a href="waiter-tables.html">
                🪑
                <span>Tables</span>
            </a>

        </nav>

        <div class="logout">

            <a href="../login.html">
                🚪
                <span>Logout</span>
            </a>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <h2>Orders</h2>

            <div class="date" id="date"></div>

        </header>


        <section class="content">

            <!-- STATS -->

            <div class="stats">

                <div class="stat">
                    <div>🆕</div>
                    <h3 id="newCount">0</h3>
                    <p>New Orders</p>
                </div>

                <div class="stat">
                    <div>👨‍🍳</div>
                    <h3 id="cookingCount">0</h3>
                    <p>Cooking</p>
                </div>

                <div class="stat">
                    <div>🍽️</div>
                    <h3 id="readyCount">0</h3>
                    <p>Ready to Serve</p>
                </div>

                <div class="stat">
                    <div>✅</div>
                    <h3 id="servedCount">0</h3>
                    <p>Served Today</p>
                </div>

            </div>


            <!-- TOOLBAR -->

            <div class="toolbar">

                <div class="filters">

                    <button
                        class="filter active"
                        onclick="filterOrders('all', this)">
                        All
                    </button>

                    <button
                        class="filter"
                        onclick="filterOrders('new', this)">
                        New
                    </button>

                    <button
                        class="filter"
                        onclick="filterOrders('confirmed', this)">
                        Confirmed
                    </button>

                    <button
                        class="filter"
                        onclick="filterOrders('cooking', this)">
                        Cooking
                    </button>

                    <button
                        class="filter"
                        onclick="filterOrders('ready', this)">
                        Ready
                    </button>

                    <button
                        class="filter"
                        onclick="filterOrders('served', this)">
                        Served
                    </button>

                </div>


                <input
                    class="search"
                    id="search"
                    placeholder="Search order..."
                    onkeyup="searchOrders()">

            </div>


            <!-- ORDERS TABLE -->

            <div class="orders-box">

                <table>

                    <thead>

                    <tr>

                        <th>Order</th>

                        <th>Customer</th>

                        <th>Table</th>

                        <th>Items</th>

                        <th>Time</th>

                        <th>Status</th>

                        <th>Actions</th>

                    </tr>

                    </thead>


                    <tbody id="orders">

                    <tr>

                        <td colspan="7" class="loading">
                            Loading orders...
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<!-- MODAL -->

<div class="modal" id="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Order Details</h2>

            <span
                class="close"
                onclick="closeModal()">
                ×
            </span>

        </div>


        <div class="detail">

            <span>Order</span>

            <strong id="mOrder"></strong>

        </div>


        <div class="detail">

            <span>Customer</span>

            <strong id="mCustomer"></strong>

        </div>


        <div class="detail">

            <span>Phone</span>

            <strong id="mPhone"></strong>

        </div>


        <div class="detail">

            <span>Items</span>

            <strong id="mItems"></strong>

        </div>


        <div class="detail">

            <span>Total</span>

            <strong id="mTotal"></strong>

        </div>


        <div class="detail">

            <span>Payment</span>

            <strong id="mPayment"></strong>

        </div>


        <div class="detail">

            <span>Status</span>

            <strong id="mStatus"></strong>

        </div>

    </div>

</div>


<script>

const API_URL = "http://localhost:5000/api/orders";

let allOrders = [];
let currentFilter = "all";


/* =========================
   DATE
========================= */

document.getElementById("date").textContent =
    new Date().toLocaleDateString("en-US", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    });


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders() {

    try {

        console.log("📡 Loading orders...");

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Server returned " + response.status);
        }

        allOrders = await response.json();

        console.log("📦 Orders received:", allOrders);

        await loadOrderItems();

    } catch (error) {

        console.error("❌ Error loading orders:", error);

        document.getElementById("orders").innerHTML = `
            <tr>
                <td colspan="7" class="error">
                    ❌ Cannot connect to the server.
                    <br><br>
                    Make sure Node.js server is running.
                    <br>
                    ${escapeHtml(error.message)}
                </td>
            </tr>
        `;

    }

}


/* =========================
   LOAD ORDER ITEMS
========================= */

async function loadOrderItems() {

    for (const order of allOrders) {

        try {

            const response = await fetch(
                `${API_URL}/${order.id}`
            );

            if (!response.ok) {

                order.items = [];

                continue;
            }

            const data = await response.json();

            order.items = data.items || [];

        } catch (error) {

            console.error(
                `❌ Error loading items for order ${order.id}:`,
                error
            );

            order.items = [];

        }

    }

    displayOrders();

    updateStats();

}


/* =========================
   DISPLAY ORDERS
========================= */

function displayOrders() {

    const container =
        document.getElementById("orders");

    container.innerHTML = "";


    let filteredOrders =
        allOrders.filter(order => {

            const status =
                convertStatus(order.status);

            if (currentFilter === "all") {
                return true;
            }

            return status === currentFilter;

        });


    /* SEARCH */

    const searchValue =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    if (searchValue) {

        filteredOrders =
            filteredOrders.filter(order => {

                return (

                    String(order.id)
                        .toLowerCase()
                        .includes(searchValue)

                    ||

                    String(order.customer_name || "")
                        .toLowerCase()
                        .includes(searchValue)

                    ||

                    String(order.phone || "")
                        .toLowerCase()
                        .includes(searchValue)

                );

            });

    }


    /* NO ORDERS */

    if (filteredOrders.length === 0) {

        container.innerHTML = `
            <tr>

                <td
                    colspan="7"
                    class="loading">

                    No orders found.

                </td>

            </tr>
        `;

        return;
    }


    /* DISPLAY */

    filteredOrders.forEach(order => {

        const status =
            convertStatus(order.status);

        const statusText =
            getStatusText(order.status);


        let itemsHTML = "No items";


        if (
            order.items &&
            order.items.length > 0
        ) {

            itemsHTML =
                order.items
                    .map(item => `
                        ${item.quantity}x
                        ${escapeHtml(item.name)}
                    `)
                    .join("<br>");

        }


        let time = "--";


        if (order.created_at) {

            time =
                new Date(order.created_at)
                    .toLocaleTimeString([], {
                        hour: "2-digit",
                        minute: "2-digit"
                    });

        }


        /* ACTIONS */

        let actions = `
            <button
                class="btn view"
                onclick="viewOrder(${order.id})">
                View
            </button>
        `;


        /* PENDING */

        if (order.status === "Pending") {

            actions = `
                <button
                    class="btn confirm"
                    onclick="confirmOrder(${order.id})">
                    Confirm
                </button>

                <button
                    class="btn view"
                    onclick="viewOrder(${order.id})">
                    View
                </button>
            `;

        }


        /* READY */

        if (order.status === "Ready") {

            actions = `
                <button
                    class="btn serve"
                    onclick="serveOrder(${order.id})">
                    Serve
                </button>

                <button
                    class="btn view"
                    onclick="viewOrder(${order.id})">
                    View
                </button>
            `;

        }


        const row =
            document.createElement("tr");


        row.dataset.status = status;


        row.innerHTML = `

            <td class="order-id">

                #ORD-${String(order.id).padStart(4, "0")}

            </td>


            <td class="customer">

                ${escapeHtml(
                    order.customer_name || "Unknown"
                )}

                <br>

                <small>
                    ${escapeHtml(order.phone || "")}
                </small>

            </td>


            <td>

                —

            </td>


            <td class="items">

                ${itemsHTML}

            </td>


            <td>

                ${time}

            </td>


            <td>

                <span class="status ${status}">

                    ${statusText}

                </span>

            </td>


            <td>

                ${actions}

            </td>

        `;


        container.appendChild(row);

    });

}


/* =========================
   STATUS
========================= */

function convertStatus(status) {

    switch (status) {

        case "Pending":
            return "new";

        case "Preparing":
            return "cooking";

        case "Ready":
            return "ready";

        case "Completed":
        case "Delivered":
            return "served";

        case "Cancelled":
            return "served";

        default:
            return "new";

    }

}


function getStatusText(status) {

    switch (status) {

        case "Pending":
            return "New";

        case "Preparing":
            return "Cooking";

        case "Ready":
            return "Ready";

        case "Completed":
            return "Served";

        case "Delivered":
            return "Delivered";

        case "Cancelled":
            return "Cancelled";

        default:
            return status || "New";

    }

}


/* =========================
   CONFIRM ORDER
========================= */

async function confirmOrder(orderId) {

    try {

        const response =
            await fetch(
                `${API_URL}/${orderId}/status`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        status: "Preparing"
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message || "Update failed"
            );

        }


        alert(
            "Order confirmed and sent to the kitchen."
        );


        await loadOrders();


    } catch (error) {

        console.error(error);

        alert(
            "❌ Error updating order: " +
            error.message
        );

    }

}


/* =========================
   SERVE ORDER
========================= */

async function serveOrder(orderId) {

    try {

        const response =
            await fetch(
                `${API_URL}/${orderId}/status`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        status: "Completed"
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message || "Update failed"
            );

        }


        alert(
            "Order marked as served."
        );


        await loadOrders();


    } catch (error) {

        console.error(error);

        alert(
            "❌ Error updating order: " +
            error.message
        );

    }

}


/* =========================
   FILTER
========================= */

function filterOrders(status, button) {

    currentFilter = status;


    document
        .querySelectorAll(".filter")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    displayOrders();

}


/* =========================
   SEARCH
========================= */

function searchOrders() {

    displayOrders();

}


/* =========================
   STATS
========================= */

function updateStats() {

    let newOrders = 0;

    let cooking = 0;

    let ready = 0;

    let served = 0;


    allOrders.forEach(order => {

        switch (order.status) {

            case "Pending":

                newOrders++;

                break;


            case "Preparing":

                cooking++;

                break;


            case "Ready":

                ready++;

                break;


            case "Completed":

            case "Delivered":

                served++;

                break;

        }

    });


    document.getElementById(
        "newCount"
    ).textContent = newOrders;


    document.getElementById(
        "cookingCount"
    ).textContent = cooking;


    document.getElementById(
        "readyCount"
    ).textContent = ready;


    document.getElementById(
        "servedCount"
    ).textContent = served;

}


/* =========================
   VIEW ORDER
========================= */

function viewOrder(orderId) {

    const order =
        allOrders.find(
            item =>
                Number(item.id) ===
                Number(orderId)
        );


    if (!order) return;


    document.getElementById(
        "mOrder"
    ).textContent =
        "#ORD-" +
        String(order.id).padStart(4, "0");


    document.getElementById(
        "mCustomer"
    ).textContent =
        order.customer_name ||
        "Unknown";


    document.getElementById(
        "mPhone"
    ).textContent =
        order.phone ||
        "—";


    document.getElementById(
        "mItems"
    ).innerHTML =

        order.items &&
        order.items.length

        ?

        order.items
            .map(item =>
                `${item.quantity}x ${escapeHtml(item.name)}`
            )
            .join("<br>")

        :

        "No items";


    document.getElementById(
        "mTotal"
    ).textContent =
        `${Number(order.total_price || 0).toFixed(2)} DA`;


    document.getElementById(
        "mPayment"
    ).textContent =
        order.payment_method ||
        "—";


    document.getElementById(
        "mStatus"
    ).textContent =
        order.status ||
        "Pending";


    document.getElementById(
        "modal"
    ).style.display =
        "flex";

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal() {

    document.getElementById(
        "modal"
    ).style.display =
        "none";

}


window.onclick =
    function(event) {

        const modal =
            document.getElementById("modal");


        if (
            event.target === modal
        ) {

            closeModal();

        }

    };


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   AUTO REFRESH
========================= */

loadOrders();

/*
   Refresh orders every 5 seconds
   so new customer orders appear
   automatically.
*/

setInterval(
    loadOrders,
    5000
);

</script>

</body>
</html>
