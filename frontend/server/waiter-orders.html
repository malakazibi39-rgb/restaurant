<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waiter - Orders</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f5f6fa;color:#2d3436;}
.layout{display:flex;min-height:100vh;}

/* ================= SIDEBAR (same as tables page) ================= */
.sidebar{width:250px;background:#1f2937;color:white;padding:20px 15px;position:fixed;height:100vh;}
.logo{text-align:center;font-size:22px;font-weight:bold;margin-bottom:35px;}
.logo span{color:#3498db;}
.profile{text-align:center;padding-bottom:25px;border-bottom:1px solid #374151;margin-bottom:20px;}
.avatar{width:65px;height:65px;border-radius:50%;background:#3498db;display:flex;align-items:center;justify-content:center;margin:auto;font-size:28px;}
.profile h3{margin-top:10px;}
.profile p{color:#9ca3af;font-size:13px;}
.menu a{display:flex;align-items:center;gap:12px;color:#d1d5db;text-decoration:none;padding:13px 15px;border-radius:8px;margin-bottom:7px;}
.menu a:hover,.menu a.active{background:#3498db;color:white;}
.logout{position:absolute;bottom:20px;left:15px;right:15px;}
.logout a{color:#ff7675;text-decoration:none;}

/* ================= MAIN ================= */
.main{margin-left:250px;width:calc(100% - 250px);}
.topbar{height:70px;background:white;padding:0 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;}
.date{color:#777;font-size:14px;}
.content{padding:30px;}

/* ================= STATS ================= */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:25px;}
.stat-card{background:white;padding:22px;border-radius:12px;}
.stat-card h3{font-size:14px;color:#6b7280;margin-bottom:10px;}
.stat-card .number{font-size:30px;font-weight:bold;}

/* ================= FILTERS ================= */
.filters{background:white;padding:18px;border-radius:12px;margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;}
.filter-btn{border:none;background:#f1f2f6;padding:10px 17px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:bold;}
.filter-btn:hover{background:#e5e7eb;}
.filter-btn.active{background:#3498db;color:white;}

/* ================= TABLE ================= */
.orders-container{background:white;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,0.05);}
.table-wrapper{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:950px;}
thead{background:#f9fafb;}
th{padding:16px;text-align:left;font-size:13px;color:#6b7280;border-bottom:1px solid #e5e7eb;}
td{padding:16px;border-bottom:1px solid #f0f0f0;font-size:14px;}
tbody tr:hover{background:#fafafa;}

.table-number{display:inline-flex;align-items:center;justify-content:center;min-width:75px;padding:7px 12px;border-radius:8px;background:#eef2ff;color:#3730a3;font-weight:bold;}

/* ================= STATUS ================= */
.status{display:inline-block;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold;}
.status-new{background:#fef3c7;color:#92400e;}
.status-cooking{background:#dbeafe;color:#1e40af;}
.status-ready{background:#dcfce7;color:#166534;}
.status-served{background:#e5e7eb;color:#374151;}
.status-cancelled{background:#fee2e2;color:#991b1b;}

/* ================= BUTTONS ================= */
.actions{display:flex;gap:7px;flex-wrap:wrap;}
.btn{border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:bold;}
.btn-view{background:#f1f2f6;color:#111827;}
.btn-confirm{background:#2563eb;color:white;}
.btn-serve{background:#16a34a;color:white;}
.btn:hover{opacity:0.85;}

.empty{padding:50px;text-align:center;color:#6b7280;}
.loading{padding:40px;text-align:center;color:#6b7280;}

/* ================= MODAL ================= */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:2000;padding:20px;}
.modal.show{display:flex;}
.modal-content{background:white;width:100%;max-width:550px;max-height:90vh;overflow-y:auto;border-radius:14px;padding:25px;}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.modal-header h2{font-size:22px;}
.close{border:none;background:none;font-size:28px;cursor:pointer;color:#6b7280;}
.detail-row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #eee;}
.detail-label{color:#6b7280;}
.detail-value{font-weight:bold;text-align:right;}
.items-list{margin-top:20px;}
.items-list h3{margin-bottom:12px;}
.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;}
.total{display:flex;justify-content:space-between;margin-top:20px;padding-top:15px;border-top:2px solid #111827;font-size:18px;font-weight:bold;}

/* ================= RESPONSIVE ================= */
@media(max-width:1000px){
    .stats{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:700px){
    .sidebar{width:70px;padding:15px 8px;}
    .logo span,.profile h3,.profile p,.menu span{display:none;}
    .profile{border:none;}
    .main{margin-left:70px;width:calc(100% - 70px);}
    .content{padding:15px;}
    .stats{grid-template-columns:1fr 1fr;}
}
</style>
</head>

<body>

<div class="layout">

<!-- ================= SIDEBAR ================= -->
<aside class="sidebar">

    <div class="logo">🍽️ <span>Restaurant</span></div>

    <div class="profile">
        <div class="avatar">🧑‍🍳</div>
        <h3 id="waiterName">John Carter</h3>
        <p>Waiter</p>
    </div>

    <nav class="menu">
        <a href="waiter.html">🏠 <span>Dashboard</span></a>
        <a href="waiter-orders.html" class="active">📋 <span>Orders</span></a>
        <a href="waiter-tables.html">🪑 <span>Tables</span></a>
    </nav>

    <div class="logout menu">
        <a href="#" onclick="logout(event)">🚪 <span>Logout</span></a>
    </div>

</aside>


<!-- ================= MAIN ================= -->
<main class="main">

    <header class="topbar">
        <h2>Orders</h2>
        <div class="date" id="date"></div>
    </header>

    <section class="content">

        <!-- STATISTICS -->
        <div class="stats">
            <div class="stat-card"><h3>New Orders</h3><div class="number" id="newCount">0</div></div>
            <div class="stat-card"><h3>Cooking</h3><div class="number" id="cookingCount">0</div></div>
            <div class="stat-card"><h3>Ready</h3><div class="number" id="readyCount">0</div></div>
            <div class="stat-card"><h3>Served</h3><div class="number" id="servedCount">0</div></div>
        </div>

        <!-- FILTERS -->
        <div class="filters">
            <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
            <button class="filter-btn" onclick="setFilter('new', this)">New</button>
            <button class="filter-btn" onclick="setFilter('confirmed', this)">Confirmed</button>
            <button class="filter-btn" onclick="setFilter('cooking', this)">Cooking</button>
            <button class="filter-btn" onclick="setFilter('ready', this)">Ready</button>
            <button class="filter-btn" onclick="setFilter('served', this)">Served</button>
        </div>

        <!-- ORDERS TABLE -->
        <div class="orders-container">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Customer</th>
                            <th>Table</th>
                            <th>Items</th>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="ordersBody">
                        <tr><td colspan="7" class="loading">Loading orders...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </section>

</main>

</div>


<!-- ================= ORDER DETAILS MODAL ================= -->
<div class="modal" id="orderModal" onclick="closeModalOutside(event)">
    <div class="modal-content" onclick="event.stopPropagation()">

        <div class="modal-header">
            <h2 id="modalTitle">Order Details</h2>
            <button class="close" onclick="closeModal()">×</button>
        </div>

        <div id="modalBody"></div>

    </div>
</div>


<script>

const API_URL = "http://localhost:5000/api/orders";

let orders = [];
let currentFilter = "all";


/* ================= DATE ================= */

document.getElementById("date").textContent =
    new Date().toLocaleDateString("en-US", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    });


/* ================= ESCAPE HTML ================= */

function escapeHtml(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ================= LOAD WAITER ================= */

function loadWaiter(){

    try{

        const user = JSON.parse(localStorage.getItem("user") || "{}");

        if(user.name){
            document.getElementById("waiterName").textContent = user.name;
        }

    }
    catch(error){
        console.error("Error loading waiter:", error);
    }

}


/* ================= LOAD ORDERS ================= */

async function loadOrders(){

    try{

        const response = await fetch(API_URL);

        if(!response.ok){
            throw new Error("Failed to load orders");
        }

        const data = await response.json();

        orders = Array.isArray(data) ? data : [];

        // Get items for every order
        await Promise.all(

            orders.map(async (order) => {

                try{

                    const res = await fetch(`${API_URL}/${order.id}`);

                    if(res.ok){
                        const d = await res.json();
                        order.items = d.items || [];
                    }
                    else{
                        order.items = [];
                    }

                }
                catch(error){

                    console.error(`Error loading items for order ${order.id}:`, error);

                    order.items = [];

                }

            })

        );

        updateStatistics();

        displayOrders();

    }
    catch(error){

        console.error("Error loading orders:", error);

        document.getElementById("ordersBody").innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    Unable to load orders.
                    <br><br>
                    Make sure the backend server is running.
                </td>
            </tr>
        `;

    }

}


/* ================= STATUS CONVERTER ================= */

function convertStatus(status){

    switch(status){

        case "Pending":
            return "new";

        case "Preparing":
            return "cooking";

        case "Ready":
            return "ready";

        case "Completed":
        case "Delivered":
            return "served";

        case "Cancelled":
            return "cancelled";

        default:
            return "new";

    }

}


/* ================= STATUS TEXT ================= */

function statusText(status){

    switch(status){

        case "Pending":
            return "New";

        case "Preparing":
            return "Cooking";

        case "Ready":
            return "Ready";

        case "Completed":
        case "Delivered":
            return "Served";

        case "Cancelled":
            return "Cancelled";

        default:
            return status || "Unknown";

    }

}


/* ================= FORMAT TIME ================= */

function formatTime(dateValue){

    if(!dateValue){
        return "—";
    }

    const date = new Date(dateValue);

    if(isNaN(date.getTime())){
        return "—";
    }

    return date.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });

}


/* ================= UPDATE STATISTICS ================= */

function updateStatistics(){

    let newCount = 0;
    let cookingCount = 0;
    let readyCount = 0;
    let servedCount = 0;

    orders.forEach(order => {

        const status = convertStatus(order.status);

        if(status === "new") newCount++;
        else if(status === "cooking") cookingCount++;
        else if(status === "ready") readyCount++;
        else if(status === "served") servedCount++;

    });

    document.getElementById("newCount").textContent = newCount;
    document.getElementById("cookingCount").textContent = cookingCount;
    document.getElementById("readyCount").textContent = readyCount;
    document.getElementById("servedCount").textContent = servedCount;

}


/* ================= FILTER ================= */

function setFilter(filter, button){

    currentFilter = filter;

    document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    displayOrders();

}


/* ================= DISPLAY ORDERS ================= */

function displayOrders(){

    const tbody = document.getElementById("ordersBody");

    let filteredOrders = orders;

    if(currentFilter !== "all"){

        filteredOrders = orders.filter(order => {

            // confirmed = preparing
            if(currentFilter === "confirmed"){
                return order.status === "Preparing";
            }

            return convertStatus(order.status) === currentFilter;

        });

    }

    if(filteredOrders.length === 0){

        tbody.innerHTML = `
            <tr>
                <td colspan="7" class="empty">No orders found.</td>
            </tr>
        `;

        return;

    }

    tbody.innerHTML = filteredOrders.map(order => {

        const status = convertStatus(order.status);

        const items = order.items || [];

        const itemCount = items.reduce(
            (total, item) => total + (Number(item.quantity) || 0),
            0
        );

        // Table number comes directly from orders.table_number
        let tableDisplay = "—";

        if(order.table_number !== null && order.table_number !== undefined && order.table_number !== ""){
            tableDisplay = `Table ${escapeHtml(order.table_number)}`;
        }

        // Actions
        let actions = `
            <button class="btn btn-view" onclick="viewOrder(${order.id})">View</button>
        `;

        if(order.status === "Pending"){
            actions += `
                <button class="btn btn-confirm" onclick="updateStatus(${order.id}, 'Preparing')">
                    Confirm
                </button>
            `;
        }

        if(order.status === "Ready"){
            actions += `
                <button class="btn btn-serve" onclick="updateStatus(${order.id}, 'Completed')">
                    Serve
                </button>
            `;
        }

        return `
            <tr>

                <td><strong>#${escapeHtml(order.id)}</strong></td>

                <td>
                    <strong>${escapeHtml(order.customer_name || "Unknown")}</strong>
                    ${order.phone
                        ? `<div style="color:#6b7280;font-size:12px;margin-top:4px;">${escapeHtml(order.phone)}</div>`
                        : ""}
                </td>

                <td><span class="table-number">🪑 ${tableDisplay}</span></td>

                <td>${itemCount} item${itemCount !== 1 ? "s" : ""}</td>

                <td>${formatTime(order.created_at || order.createdAt)}</td>

                <td>
                    <span class="status status-${status}">
                        ${escapeHtml(statusText(order.status))}
                    </span>
                </td>

                <td><div class="actions">${actions}</div></td>

            </tr>
        `;

    }).join("");

}


/* ================= VIEW ORDER ================= */

async function viewOrder(orderId){

    const modal = document.getElementById("orderModal");
    const modalBody = document.getElementById("modalBody");
    const modalTitle = document.getElementById("modalTitle");

    modalTitle.textContent = `Order #${orderId}`;

    modalBody.innerHTML = `<div class="loading">Loading order details...</div>`;

    modal.classList.add("show");

    try{

        const response = await fetch(`${API_URL}/${orderId}`);

        const data = await response.json();

        if(!response.ok){
            throw new Error(data.message || "Unable to load order");
        }

        const order = data.order;
        const items = data.items || [];

        const itemsHTML = items.length > 0
            ? items.map(item => `
                <div class="item">
                    <div>
                        <strong>${escapeHtml(item.name)}</strong>
                        <div style="color:#6b7280;font-size:12px;margin-top:3px;">
                            Quantity: ${escapeHtml(item.quantity)}
                        </div>
                    </div>
                    <strong>${(Number(item.price) * Number(item.quantity)).toFixed(2)}</strong>
                </div>
            `).join("")
            : `<p style="color:#6b7280;">No items found.</p>`;

        const tableNumber =
            order.table_number !== null && order.table_number !== undefined && order.table_number !== ""
                ? `Table ${escapeHtml(order.table_number)}`
                : "Not assigned";

        modalBody.innerHTML = `

            <div class="detail-row">
                <span class="detail-label">Customer</span>
                <span class="detail-value">${escapeHtml(order.customer_name || "Unknown")}</span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Phone</span>
                <span class="detail-value">${escapeHtml(order.phone || "—")}</span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Table</span>
                <span class="detail-value">🪑 ${tableNumber}</span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Payment</span>
                <span class="detail-value">${escapeHtml(order.payment_method || "Cash")}</span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="detail-value">
                    <span class="status status-${convertStatus(order.status)}">
                        ${escapeHtml(statusText(order.status))}
                    </span>
                </span>
            </div>

            <div class="items-list">
                <h3>Order Items</h3>
                ${itemsHTML}
            </div>

            <div class="total">
                <span>Total</span>
                <span>${Number(order.total_price || 0).toFixed(2)}</span>
            </div>

        `;

    }
    catch(error){

        console.error("Error viewing order:", error);

        modalBody.innerHTML = `
            <p style="color:#dc2626;">
                ${escapeHtml(error.message || "Unable to load order details.")}
            </p>
        `;

    }

}


/* ================= UPDATE ORDER STATUS ================= */

async function updateStatus(orderId, newStatus){

    if(!confirm(`Change order #${orderId} status to ${newStatus}?`)){
        return;
    }

    try{

        const response = await fetch(`${API_URL}/${orderId}/status`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: newStatus })
        });

        const data = await response.json();

        if(!response.ok){
            throw new Error(data.message || "Unable to update status");
        }

        // Update locally
        const order = orders.find(o => Number(o.id) === Number(orderId));

        if(order){
            order.status = newStatus;
        }

        updateStatistics();

        displayOrders();

    }
    catch(error){

        console.error("Error updating order:", error);

        alert(error.message || "Unable to update order status.");

    }

}


/* ================= MODAL ================= */

function closeModal(){
    document.getElementById("orderModal").classList.remove("show");
}

function closeModalOutside(event){

    if(event.target.id === "orderModal"){
        closeModal();
    }

}


/* ================= LOGOUT ================= */

function logout(event){

    event.preventDefault();

    // Clear saved login data
    localStorage.clear();
    sessionStorage.clear();

    // Adjust this path to where your login.html really is
    window.location.href = "../login.html";

}


/* ================= INITIAL LOAD ================= */

document.addEventListener("DOMContentLoaded", () => {

    loadWaiter();

    loadOrders();

});

// Auto refresh every 5 seconds
setInterval(loadOrders, 5000);

</script>

</body>
</html>
