<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Payments & Invoices</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f5f6fa;color:#2d3436;}
.layout{display:flex;min-height:100vh;}

.sidebar{width:250px;background:#1f2937;color:white;padding:20px 15px;position:fixed;height:100vh;}
.logo{text-align:center;font-size:22px;font-weight:bold;margin-bottom:35px;}
.logo span{color:#f39c12;}
.profile{text-align:center;padding-bottom:25px;border-bottom:1px solid #374151;margin-bottom:20px;}
.avatar{width:65px;height:65px;border-radius:50%;background:#f39c12;display:flex;align-items:center;justify-content:center;margin:auto;font-size:28px;}
.profile h3{margin-top:10px;}
.profile p{color:#9ca3af;font-size:13px;}
.menu a{display:flex;gap:12px;align-items:center;color:#d1d5db;text-decoration:none;padding:13px 15px;border-radius:8px;margin-bottom:7px;}
.menu a:hover,.menu a.active{background:#f39c12;color:white;}
.logout{position:absolute;bottom:20px;left:15px;right:15px;}
.logout a{color:#ff7675;text-decoration:none;}

.main{margin-left:250px;width:calc(100% - 250px);}
.topbar{height:70px;background:white;padding:0 30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;}
.date{color:#777;}
.content{padding:30px;}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:25px;}
.stat{background:white;padding:20px;border-radius:12px;}
.stat h3{font-size:27px;margin:8px 0;}
.stat p{color:#777;}

.toolbar{background:white;padding:18px;border-radius:12px;margin-bottom:20px;display:flex;justify-content:space-between;}
.search{padding:10px 15px;border:1px solid #ddd;border-radius:7px;width:240px;}

.box{background:white;border-radius:12px;overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:900px;}
th{padding:16px;background:#f8f9fa;text-align:left;color:#666;font-size:13px;}
td{padding:16px;border-top:1px solid #eee;}

.status{padding:6px 10px;border-radius:20px;font-size:11px;font-weight:bold;}
.paid{background:#d1fae5;color:#047857;}
.refunded{background:#fee2e2;color:#b91c1c;}

.btn{border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:bold;}
.invoice{background:#3498db;color:white;}
.print{background:#f1f2f6;}

.empty,.loading{text-align:center;padding:40px;color:#777;}
.error{text-align:center;padding:40px;color:#b91c1c;}

@media(max-width:1000px){
.stats{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:700px){
.sidebar{width:70px;padding:15px 8px;}
.logo span,.profile h3,.profile p,.menu span{display:none;}
.profile{border:none;}
.main{margin-left:70px;width:calc(100% - 70px);}
.content{padding:15px;}
.toolbar{flex-direction:column;gap:12px;}
.search{width:100%;}
}
</style>
</head>

<body>

<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">

<div class="logo">💳 <span>Restaurant</span></div>

<div class="profile">
<div class="avatar">💰</div>
<h3>Michael Carter</h3>
<p>Cashier</p>
</div>

<nav class="menu">
<a href="cashier.html">🏠 <span>Dashboard</span></a>
<a href="cashier-orders.html">📋 <span>Orders</span></a>
<a href="cashier-payments.html" class="active">💳 <span>Payments</span></a>
</nav>

<div class="logout menu">
<a href="#" onclick="logout(event)">🚪 <span>Logout</span></a>
</div>

</aside>

<!-- MAIN -->
<main class="main">

<header class="topbar">
<h2>Payments & Invoices</h2>
<div class="date" id="date"></div>
</header>

<section class="content">

<!-- STATISTICS -->
<div class="stats">
<div class="stat"><h3 id="paidOrders">0</h3><p>Paid Orders</p></div>
<div class="stat"><h3 id="totalRevenue">0 DA</h3><p>Total Revenue</p></div>
<div class="stat"><h3 id="cashPayments">0</h3><p>Cash Payments</p></div>
<div class="stat"><h3 id="cardPayments">0</h3><p>Card Payments</p></div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
<h3>Payment History</h3>
<input id="search" class="search" placeholder="Search payment..." onkeyup="searchPayments()">
</div>

<!-- TABLE -->
<div class="box">
<table>
<thead>
<tr>
<th>Payment ID</th>
<th>Order</th>
<th>Customer</th>
<th>Amount</th>
<th>Method</th>
<th>Date</th>
<th>Status</th>
<th>Invoice</th>
</tr>
</thead>

<tbody id="payments">
<tr><td colspan="8" class="loading">Loading payments...</td></tr>
</tbody>
</table>
</div>

</section>
</main>
</div>


<script>

// =====================================================
// API
// =====================================================

const API_URL = "http://localhost:5000/api/orders";


// =====================================================
// TODAY'S DATE (top bar)
// =====================================================

document.getElementById("date").textContent =
new Date().toLocaleDateString("en-US", {
    weekday:"long",
    year:"numeric",
    month:"long",
    day:"numeric"
});


// =====================================================
// FORMAT ORDER DATE (from database)
// =====================================================

function formatOrderDate(value){

    if(!value) return "-";

    const d = new Date(value);

    if(isNaN(d.getTime())) return "-";

    return d.toLocaleString("en-GB");

}


// =====================================================
// LOAD PAYMENTS
// =====================================================

async function loadPayments(){

    const tbody = document.getElementById("payments");

    try{

        const response = await fetch(API_URL);

        if(!response.ok){
            throw new Error("HTTP error: " + response.status);
        }

        const data = await response.json();

        console.log("📦 Orders received:", data);

        // Backend may return an array or { orders: [...] }
        const orders = data.orders || data;

        if(!Array.isArray(orders)){
            throw new Error("Invalid orders data");
        }

        // Only paid / completed orders
        const payments = orders.filter(order => {
            return (
                order.status === "Completed" ||
                order.status === "Paid" ||
                order.payment_status === "Paid"
            );
        });

        if(payments.length === 0){

            tbody.innerHTML = `
                <tr>
                    <td colspan="8" class="empty">
                        No paid payments found.
                    </td>
                </tr>
            `;

            updateStatistics([]);
            return;

        }

        tbody.innerHTML = "";

        payments.forEach(order => {

            const paymentId = "PAY-" + String(order.id).padStart(4,"0");
            const orderId   = "ORD-" + String(order.id).padStart(4,"0");

            const customer = order.customer_name || "Unknown";
            const amount   = Number(order.total_price || 0);
            const method   = order.payment_method || "Cash";

            // Real date from the database (created_at column)
            const date = formatOrderDate(order.created_at);

            const row = document.createElement("tr");

            row.innerHTML = `
                <td><strong>#${paymentId}</strong></td>
                <td>#${orderId}</td>
                <td>${escapeHTML(customer)}</td>
                <td>${formatMoney(amount)} DA</td>
                <td>${escapeHTML(method)}</td>
                <td>${date}</td>
                <td><span class="status paid">Paid</span></td>
                <td>
                    <button class="btn invoice"
                        onclick="invoice('${paymentId}', ${order.id})">
                        Invoice
                    </button>

                    <button class="btn print"
                        onclick="printInvoice('${paymentId}', ${order.id})">
                        Print
                    </button>
                </td>
            `;

            tbody.appendChild(row);

        });

        updateStatistics(payments);

    }
    catch(error){

        console.error("❌ Error loading payments:", error);

        tbody.innerHTML = `
            <tr>
                <td colspan="8" class="error">
                    ❌ Cannot load payments.
                    <br><br>
                    Make sure Node.js server is running on port 5000.
                </td>
            </tr>
        `;

    }

}


// =====================================================
// UPDATE STATISTICS
// =====================================================

function updateStatistics(payments){

    const paidOrders = payments.length;

    const totalRevenue = payments.reduce(
        (sum, order) => sum + Number(order.total_price || 0),
        0
    );

    const cashPayments = payments.filter(order =>
        String(order.payment_method || "").toLowerCase() === "cash"
    ).length;

    const cardPayments = payments.filter(order =>
        String(order.payment_method || "").toLowerCase() === "card"
    ).length;

    document.getElementById("paidOrders").textContent = paidOrders;
    document.getElementById("totalRevenue").textContent = formatMoney(totalRevenue) + " DA";
    document.getElementById("cashPayments").textContent = cashPayments;
    document.getElementById("cardPayments").textContent = cardPayments;

}


// =====================================================
// FORMAT MONEY
// =====================================================

function formatMoney(number){
    return Number(number || 0).toLocaleString("en-US");
}


// =====================================================
// SEARCH
// =====================================================

function searchPayments(){

    const value = document.getElementById("search").value.toLowerCase();

    document.querySelectorAll("#payments tr").forEach(row => {
        row.style.display =
            row.innerText.toLowerCase().includes(value) ? "" : "none";
    });

}


// =====================================================
// INVOICE
// =====================================================

function invoice(paymentId, orderId){

    alert("Invoice generated successfully for " + paymentId);

    console.log("Invoice for order:", orderId);

}


// =====================================================
// PRINT INVOICE
// =====================================================

function printInvoice(paymentId, orderId){

    console.log("Printing invoice:", paymentId, orderId);

    window.print();

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value){

    const div = document.createElement("div");

    div.textContent = value;

    return div.innerHTML;

}


// =====================================================
// LOGOUT
// =====================================================

function logout(event){

    event.preventDefault();

    // Clear saved login data
    localStorage.clear();
    sessionStorage.clear();

    // Adjust this path to where your login.html really is
    window.location.href = "../login.html";

}


// =====================================================
// LOAD WHEN PAGE OPENS
// =====================================================

document.addEventListener("DOMContentLoaded", loadPayments);

</script>

</body>
</html>
