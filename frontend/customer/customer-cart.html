<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shopping Cart</title>


    <style>

        * {
            box-sizing: border-box;

            margin: 0;

            padding: 0;

            font-family: Arial, sans-serif;
        }


        body {

            background: #f7f7f7;

            color: #333;
        }


        header {

            background: #222;

            color: white;

            padding: 20px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        header a {

            color: white;

            text-decoration: none;

            background: #ff9800;

            padding: 10px 18px;

            border-radius: 8px;
        }


        .container {

            max-width: 1000px;

            margin: 40px auto;

            padding: 20px;
        }


        h2 {

            text-align: center;

            margin-bottom: 30px;
        }


        .cart-item {

            background: white;

            margin-bottom: 15px;

            padding: 20px;

            border-radius: 10px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 3px 10px
                rgba(0,0,0,0.08);
        }


        .item-info {

            display: flex;

            align-items: center;

            gap: 15px;
        }


        .item-image {

            width: 70px;

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 40px;

            background: #eee;

            border-radius: 10px;
        }


        .item-name {

            font-size: 18px;

            font-weight: bold;
        }


        .item-price {

            color: #777;

            margin-top: 5px;
        }


        .quantity {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .quantity button {

            border: none;

            background: #ff9800;

            color: white;

            width: 32px;

            height: 32px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 18px;
        }


        .remove {

            border: none;

            background: #e53935;

            color: white;

            padding: 8px 12px;

            border-radius: 5px;

            cursor: pointer;

        }


        .summary {

            background: white;

            padding: 25px;

            border-radius: 10px;

            margin-top: 25px;

            box-shadow:
                0 3px 10px
                rgba(0,0,0,0.08);
        }


        .total {

            font-size: 24px;

            font-weight: bold;

            margin-bottom: 20px;
        }


        .checkout {

            display: block;

            width: 100%;

            text-align: center;

            background: #ff9800;

            color: white;

            text-decoration: none;

            padding: 14px;

            border-radius: 8px;

            font-weight: bold;

        }


        .empty {

            text-align: center;

            padding: 50px;

            background: white;

            border-radius: 10px;
        }

    </style>

</head>


<body>


<header>

    <h1>🛒 My Cart</h1>

    <a href="customer-menu.html">
        ← Back to Menu
    </a>

</header>


<div class="container">

    <h2>Your Order</h2>

    <div id="cartContainer"></div>

    <div
        id="summary"
        class="summary"
        style="display:none;"
    >

        <div class="total">

            Total:
            <span id="totalPrice">
                0.00
            </span>
            DA

        </div>


        <a
            href="customer-order.html"
            class="checkout"
        >
            Proceed to Order →
        </a>

    </div>

</div>


<script>


let cart =
    JSON.parse(localStorage.getItem("cart")) || [];


// ======================================
// DISPLAY CART
// ======================================

function displayCart() {

    const container =
        document.getElementById(
            "cartContainer"
        );


    const summary =
        document.getElementById(
            "summary"
        );


    if (
        !Array.isArray(cart) ||
        cart.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <h3>Your cart is empty 🛒</h3>

                <br>

                <a href="customer-menu.html">
                    Go to Menu
                </a>

            </div>

        `;


        summary.style.display =
            "none";


        return;
    }


    container.innerHTML = "";


    let total = 0;


    cart.forEach(
        (item, index) => {

            const quantity =
                Number(item.quantity) || 1;


            const price =
                Number(item.price) || 0;


            total +=
                price * quantity;


            const itemId =
                item.id ||
                item.menu_item_id ||
                null;


            const div =
                document.createElement("div");


            div.className =
                "cart-item";


            div.innerHTML = `

                <div class="item-info">

                    <div class="item-image">
                        ${item.image || "🍽️"}
                    </div>

                    <div>

                        <div class="item-name">
                            ${escapeHtml(item.name)}
                        </div>

                        <div class="item-price">
                            ${price.toFixed(2)} DA
                        </div>

                        <div style="font-size:12px;color:#999;">
                            Product ID:
                            ${itemId || "Missing"}
                        </div>

                    </div>

                </div>


                <div class="quantity">

                    <button
                        onclick="decreaseQuantity(${index})"
                    >
                        −
                    </button>

                    <span>
                        ${quantity}
                    </span>

                    <button
                        onclick="increaseQuantity(${index})"
                    >
                        +
                    </button>

                </div>


                <button
                    class="remove"
                    onclick="removeItem(${index})"
                >
                    Remove
                </button>

            `;


            container.appendChild(div);

        }
    );


    document.getElementById(
        "totalPrice"
    ).textContent =
        total.toFixed(2);


    summary.style.display =
        "block";


    console.log(
        "🛒 Current cart:",
        cart
    );

}


// ======================================
// INCREASE
// ======================================

function increaseQuantity(index) {

    cart[index].quantity =
        Number(cart[index].quantity || 1) + 1;

    saveCart();

}


// ======================================
// DECREASE
// ======================================

function decreaseQuantity(index) {

    const quantity =
        Number(cart[index].quantity || 1);


    if (quantity <= 1) {

        removeItem(index);

        return;
    }


    cart[index].quantity =
        quantity - 1;


    saveCart();

}


// ======================================
// REMOVE
// ======================================

function removeItem(index) {

    cart.splice(index, 1);

    saveCart();

}


// ======================================
// SAVE
// ======================================

function saveCart() {

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    displayCart();

}


// ======================================
// ESCAPE
// ======================================

function escapeHtml(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// ======================================
// START
// ======================================

displayCart();

</script>


</body>

</html>
