<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Place Order</title>


    <style>

        * {
            box-sizing: border-box;

            margin: 0;

            padding: 0;

            font-family: Arial, sans-serif;
        }


        body {

            background: #f7f7f7;

            color: #333;
        }


        header {

            background: #222;

            color: white;

            padding: 20px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        header a {

            color: white;

            text-decoration: none;

            background: #ff9800;

            padding: 10px 18px;

            border-radius: 8px;
        }


        .container {

            max-width: 700px;

            margin: 40px auto;

            padding: 20px;
        }


        .box {

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px
                rgba(0,0,0,0.08);
        }


        h2 {

            text-align: center;

            margin-bottom: 25px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }


        input,
        select {

            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 16px;
        }


        .items {

            background: #f7f7f7;

            padding: 15px;

            border-radius: 8px;

            margin-bottom: 20px;
        }


        .item {

            display: flex;

            justify-content: space-between;

            padding: 8px 0;

            border-bottom: 1px solid #ddd;
        }


        .total {

            font-size: 22px;

            font-weight: bold;

            margin: 20px 0;
        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #ff9800;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }


        button:hover {

            background: #e68900;
        }


        #message {

            margin-bottom: 20px;

            text-align: center;

            font-weight: bold;
        }

    </style>

</head>


<body>


<header>

    <h1>🍽️ Place Order</h1>

    <a href="customer-cart.html">
        ← Cart
    </a>

</header>


<div class="container">

    <div class="box">

        <h2>Complete Your Order</h2>

        <div id="message"></div>


        <div
            id="items"
            class="items"
        ></div>


        <label>
            Customer Name
        </label>

        <input
            type="text"
            id="customerName"
            placeholder="Enter your name"
        >


        <label>
            Phone
        </label>

        <input
            type="text"
            id="phone"
            placeholder="Enter your phone"
        >


        <label>
            Payment Method
        </label>

        <select id="paymentMethod">

            <option value="Cash">
                Cash
            </option>

            <option value="Card">
                Card
            </option>

        </select>


        <div class="total">

            Total:

            <span id="totalPrice">
                0.00
            </span>

            DA

        </div>


        <button
            onclick="placeOrder()"
        >
            ✅ Place Order
        </button>

    </div>

</div>


<script>


const API_URL =
    "http://localhost:5000/api/orders";


const MENU_API =
    "http://localhost:5000/api/menu";


let cart =
    JSON.parse(localStorage.getItem("cart")) || [];


// ======================================
// DISPLAY ITEMS
// ======================================

function displayItems() {

    const container =
        document.getElementById("items");


    if (
        !Array.isArray(cart) ||
        cart.length === 0
    ) {

        container.innerHTML =
            "<p>Your cart is empty.</p>";

        return;
    }


    let total = 0;


    container.innerHTML = "";


    cart.forEach(item => {

        const quantity =
            Number(item.quantity) || 1;


        const price =
            Number(item.price) || 0;


        total +=
            price * quantity;


        const div =
            document.createElement("div");


        div.className =
            "item";


        div.innerHTML = `

            <span>
                ${escapeHtml(item.name)}
                × ${quantity}
            </span>

            <strong>
                ${(price * quantity).toFixed(2)}
                DA
            </strong>

        `;


        container.appendChild(div);

    });


    document.getElementById(
        "totalPrice"
    ).textContent =
        total.toFixed(2);

}


// ======================================
// FIND MENU ITEM ID
// ======================================

async function prepareItems() {

    console.log(
        "🛒 Cart before sending:",
        cart
    );


    // ----------------------------------
    // Load menu from database
    // ----------------------------------

    const response =
        await fetch(MENU_API);


    if (!response.ok) {

        throw new Error(
            "Cannot load menu from server"
        );

    }


    const menuItems =
        await response.json();


    const formattedItems = [];


    // ----------------------------------
    // Process every cart item
    // ----------------------------------

    for (const item of cart) {

        let menuItemId =
            item.menu_item_id ||
            item.id;


        // ----------------------------------
        // If ID is missing, find by name
        // ----------------------------------

        if (
            !menuItemId ||
            Number.isNaN(Number(menuItemId))
        ) {

            const found =
                menuItems.find(
                    menuItem =>
                        String(menuItem.name)
                            .trim()
                            .toLowerCase()
                        ===
                        String(item.name)
                            .trim()
                            .toLowerCase()
                );


            if (found) {

                menuItemId =
                    found.id;

            }

        }


        // ----------------------------------
        // Still missing
        // ----------------------------------

        if (
            !menuItemId ||
            Number.isNaN(Number(menuItemId))
        ) {

            throw new Error(
                `Menu item "${item.name}" was not found in the database.`
            );

        }


        formattedItems.push({

            menu_item_id:
                Number(menuItemId),

            name:
                item.name,

            quantity:
                Number(item.quantity) || 1,

            price:
                Number(item.price) || 0

        });

    }


    console.log(
        "📦 Items sent to server:",
        formattedItems
    );


    return formattedItems;

}


// ======================================
// PLACE ORDER
// ======================================

async function placeOrder() {

    const message =
        document.getElementById(
            "message"
        );


    const customerName =
        document.getElementById(
            "customerName"
        ).value.trim();


    const phone =
        document.getElementById(
            "phone"
        ).value.trim();


    const paymentMethod =
        document.getElementById(
            "paymentMethod"
        ).value;


    if (!customerName) {

        message.textContent =
            "❌ Please enter your name.";

        return;
    }


    if (
        !Array.isArray(cart) ||
        cart.length === 0
    ) {

        message.textContent =
            "❌ Your cart is empty.";

        return;
    }


    try {

        message.textContent =
            "⏳ Sending order...";


        // ----------------------------------
        // Prepare products
        // ----------------------------------

        const formattedItems =
            await prepareItems();


        // ----------------------------------
        // Calculate total
        // ----------------------------------

        const totalPrice =
            formattedItems.reduce(
                (total, item) =>
                    total +
                    (
                        item.price *
                        item.quantity
                    ),
                0
            );


        // ----------------------------------
        // Send to backend
        // ----------------------------------

        const response =
            await fetch(API_URL, {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    customer_name:
                        customerName,

                    phone:
                        phone,

                    total_price:
                        totalPrice,

                    payment_method:
                        paymentMethod,

                    items:
                        formattedItems

                })

            });


        const data =
            await response.json();


        console.log(
            "📥 Server response:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Error creating order"
            );

        }


        // ----------------------------------
        // SUCCESS
        // ----------------------------------

        message.textContent =
            `✅ Order #${data.order_id} created successfully!`;


        // Empty cart

        localStorage.removeItem(
            "cart"
        );


        cart = [];


        setTimeout(() => {

            window.location.href =
                "customer-menu.html";

        }, 2000);


    } catch (error) {

        console.error(
            "❌ Order error:",
            error
        );


        message.textContent =
            "❌ " + error.message;

    }

}


// ======================================
// ESCAPE HTML
// ======================================

function escapeHtml(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// ======================================
// START
// ======================================

displayItems();

</script>


</body>

</html>
